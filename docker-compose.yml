services:
  postgres:
    image: postgres:16-alpine
    container_name: kback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kback_secret_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kback}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kback} -d ${POSTGRES_DB:-kback}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kback-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/public/uploads

volumes:
  postgres_data:
    name: kback_postgres_data
  uploads_data:
    name: kback_uploads_data
